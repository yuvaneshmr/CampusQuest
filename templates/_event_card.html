<article class="event-card">
    <div class="event-art {{ event.image_type }}">
        <img src="{{ url_for('static', filename='img/' + event.image_type + '.svg') }}" alt="">
        <span class="category">{{ event.category }}</span>
        <span class="capacity">{{ event.registrations|length }}/{{ event.capacity }}</span>
    </div>
    <div class="event-body">
        <h3>{{ event.title }}</h3>
        <p>{{ event.description|truncate(110) }}</p>
        <div class="event-meta">
            <span>▣ {{ event.event_date.strftime("%d %b %Y") }}</span>
            <span>◷ {{ event.event_time.strftime("%I:%M %p") }}</span>
            <span>⌖ {{ event.venue }}</span>
        </div>
        <a class="card-button" href="{{ url_for('event_detail', event_id=event.id) }}">View Details</a>
    </div>
</article>
